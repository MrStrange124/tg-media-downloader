<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"></head>
<body class="tgmd-popup">
  <h1>TG Media Downloader</h1>

  <button id="rundiag">Run diagnostics</button>
  <button id="copydiag">Copy report</button>
  <button id="runwalk">Diagnose walk (selection / download-all)</button>
  <button id="auditdl">Audit recent downloads</button>
  <button id="selftest">Test download (synthetic 1 MB)</button>

  <hr>
  <label for="subfolder">Destination subfolder</label>
  <input id="subfolder" type="text" value="Telegram">
  <label for="concurrency">Concurrency (1&ndash;3)</label>
  <input id="concurrency" type="number" min="1" max="3" value="2">
  <label>File layout
    <select id="layout">
      <option value="flat">Flat filenames (no subfolders) — avoids the save prompt</option>
      <option value="nested">Subfolders: Telegram/&lt;group&gt;/</option>
    </select>
  </label>
  <button id="savesettings">Save settings</button>
  <button id="clearhistory">Clear download history for this chat</button>

  <pre id="out"></pre>
</body>
<script src="popup.js"></script>
</html>
