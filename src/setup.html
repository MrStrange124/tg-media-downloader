<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TG Media Downloader — save folder</title>
  <style>
    body { font: 14px/1.55 system-ui, sans-serif; max-width: 560px; margin: 40px auto;
           padding: 0 20px; color: #eee; background: #1e1e1e; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p  { color: #bbb; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px;
             background: #2d7ff9; color: #fff; cursor: pointer; }
    button.ghost { background: #3a3a3a; }
    #state { margin: 18px 0; padding: 12px 14px; border-radius: 6px; background: #2a2a2a; }
    .ok   { color: #6ddb7c; font-weight: 600; }
    .warn { color: #ffb020; font-weight: 600; }
    code { background: #2a2a2a; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Save folder</h1>
  <p>Choosing a folder lets media be written straight to disk, so Brave never
     shows a save dialog. Files keep the same
     <code>Telegram/&lt;group&gt;/</code> layout inside whatever you pick.</p>

  <div id="state">Checking…</div>

  <p>
    <button id="choose">Choose folder…</button>
    <button id="forget" class="ghost">Clear</button>
  </p>

  <p id="note"></p>
  <script src="lib/fsa.js"></script>
  <script src="setup.js"></script>
</body>
</html>
